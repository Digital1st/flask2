<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Student Marks</title>
</head>
<body>
    <h1>Student Marks</h1>

    <form action="/add" method="post">
        <input type="text" name="name" placeholder="Student name" required>
        <input type="number" name="mark" placeholder="Mark" min="0" max="100" required>
        <button type="submit">Add</button>
    </form>

    <form action="/" method="get">
        <input type="text" name="search" placeholder="Search by name" value="{{ search }}">
        <button type="submit">Search</button>
        <a href="{{ url_for('index') }}">Clear</a>
    </form>

    <table border="1" cellpadding="8">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Mark</th>
            <th>Actions</th>
        </tr>
        {% for s in students %}
        <tr>
            <td>{{ s[0] }}</td>
            <td>{{ s[1] }}</td>
            <td>{{ s[2] }}</td>
            <td>
                <a href="{{ url_for('edit_student', student_id=s[0]) }}">Edit</a>
                <form action="{{ url_for('delete_student', student_id=s[0]) }}" method="post" style="display:inline;">
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
        {% else %}
        <tr>
            <td colspan="4">No students found.</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
